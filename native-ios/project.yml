name: SGAudioTest
options:
  bundleIdPrefix: com.soasis3
  deploymentTarget:
    iOS: "16.0"
targets:
  SGAudioTest:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soasis3.sgaudiotest
        PRODUCT_NAME: SGAudioTest
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SG Audio Test
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Monitor your USB guitar interface through headphones.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
